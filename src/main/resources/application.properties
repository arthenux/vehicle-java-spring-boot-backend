spring.application.name=vehicle-inventory-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.seed.user.username=${APP_SEED_USERNAME:Bob}
app.seed.user.password=${APP_SEED_PASSWORD:}
app.seed.user.role=${APP_SEED_ROLE:ROLE_MANAGER}

server.error.include-message=never
